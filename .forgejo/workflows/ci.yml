name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Executar Testes Biofísicos"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout do Repositório"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Executar Testes de CI e Conformidade"
        run: |
          bash tests/test_gambi_ci_and_workers_deploy.sh
          cargo test --workspace --verbose

      - name: "Auditoria de Qualidade CCCP"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict || true
          fi

  deploy-site:
    name: "Deploy KokoroSim Static Site to Cloudflare Workers"
    runs-on: ubuntu-latest
    needs: [test]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Deploy KokoroSim to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "★ Publicando KokoroSim em kokorosim.2lp.in via Cloudflare Workers..."
            cp site/_headers dist/_headers 2>/dev/null || true
            npx wrangler deploy || echo "Aviso: Falha no deploy Cloudflare Workers."
          else
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando deploy Cloudflare Workers."
          fi
