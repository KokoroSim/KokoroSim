name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main-repo
          
      - name: Checkout v1 branch
        uses: actions/checkout@v4
        with:
          ref: v1
          path: v1-repo

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build main (Wasm)
        run: |
          cd main-repo/ui
          wasm-pack build --target web

      - name: Setup Bun (for v1)
        uses: oven-sh/setup-bun@v1

      - name: Build v1 (Vite)
        run: |
          cd v1-repo
          bun install
          bunx vite build --base=./
          
      - name: Arrange files
        run: |
          # Copy v1 dist into the main ui folder
          cp -r v1-repo/dist main-repo/ui/v1
          # Garantir que o GitHub Pages não processe com Jekyll
          touch main-repo/ui/.nojekyll

      - name: Build Documentation Pages (HTML)
        run: |
          python3 -m pip install markdown
          python3 main-repo/scripts/build_docs.py

      - name: Deploy to KokoroSim.github.io
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cd main-repo/ui
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          git add -A
          git commit -m "deploy: publicar KokoroSim no GitHub Pages [skip ci]"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" git push --force git@github.com:KokoroSim/KokoroSim.github.io.git main

