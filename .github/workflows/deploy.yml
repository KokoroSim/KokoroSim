name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main-repo
          
      - name: Checkout v1 branch
        uses: actions/checkout@v4
        with:
          ref: v1
          path: v1-repo

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build main (Wasm)
        run: |
          cd main-repo/ui
          wasm-pack build --target web

      - name: Setup Bun (for v1)
        uses: oven-sh/setup-bun@v1

      - name: Build v1 (Vite)
        run: |
          cd v1-repo
          bun install
          bunx vite build --base=/${{ github.event.repository.name }}/v1/
          
      - name: Arrange files
        run: |
          # Copy v1 dist into the main ui folder
          cp -r v1-repo/dist main-repo/ui/v1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './main-repo/ui'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
