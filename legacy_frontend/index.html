<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eletrofisiologia - Cockpit</title>
</head>
<body>

    <header>
        <div class="hud-item">BPM: <span id="hud-bpm">75</span></div>
        <div class="hud-item">PR: <span id="hud-pr">160ms</span></div>
        <div class="hud-item">QRS: <span id="hud-qrs">90ms</span></div>
        <div class="hud-item">QT: <span id="hud-qt">400ms</span></div>
        <div class="hud-item">V_rest: <span id="hud-vrest">-85mV</span></div>
        <div class="hud-item">PR/RR: <span id="hud-pr-rr">-</span></div>
    </header>

    <aside id="controls-sidebar">
        <!-- Generado via JS (src/ui/sidebar.ts) -->
    </aside>

    <main>
        <div class="canvas-wrapper">
            <div class="canvas-label">Potencial de Ação Celular</div>
            <canvas id="canvas-pa"></canvas>
        </div>
        <div class="canvas-wrapper">
            <div class="canvas-label">DII (ECG)</div>
            <canvas id="canvas-ecg"></canvas>
        </div>
        <div class="canvas-wrapper">
            <div class="canvas-label">
                <select id="sel-ch3">
                    <option value="corrente_na">Corrente I_Na</option>
                    <option value="corrente_ca">Corrente I_CaL</option>
                    <option value="corrente_k">Corrente I_K</option>
                </select>
            </div>
            <canvas id="canvas-ch3"></canvas>
        </div>
        <div class="canvas-wrapper">
            <div class="canvas-label">
                <select id="sel-ch4">
                    <option value="ca_int">Cálcio Intracelular [Ca2+]i</option>
                    <option value="na_int">Sódio Intracelular [Na+]i</option>
                    <option value="corrente_f">Corrente I_f (Funny)</option>
                </select>
            </div>
            <canvas id="canvas-ch4"></canvas>
        </div>
    </main>
    <div id="about-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
        <div style="background: #111; color: #ddd; width: 80vw; max-width: 800px; max-height: 80vh; padding: 20px; border-radius: 10px; border: 1px solid #333; display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px;">
                <h2 style="margin: 0;">Sobre o SimCardio</h2>
                <button id="close-about" style="background: #e74c3c; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">X</button>
            </div>
            <div id="about-content" style="overflow-y: auto; padding-right: 10px;">
                Carregando...
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
